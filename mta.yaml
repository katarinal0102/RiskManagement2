_schema-version: 3.3.0
ID: RiskManagement2
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: RiskManagement2-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: RiskManagement2-auth
      - name: RiskManagement2-destination
      - name: RiskManagement2-db
  - name: RiskManagement2
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: RiskManagement2-auth
      - name: RiskManagement2-html5-runtime
      - name: mtx-api
        group: destinations
        properties:
          name: mtx-api # must be used in xs-app.json as well
          url: ~{mtx-url}
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"

  - name: RiskManagement2-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: RiskManagement2assets
          artifacts:
            - assets.zip
          target-path: app/
        - name: RiskManagement2riskmanagement2.risks
          artifacts:
            - riskmanagement2.risks.zip
          target-path: app/
    requires:
      - name: RiskManagement2-auth
      - name: srv-api
      - name: RiskManagement2-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            HTML5.ForwardAuthToken: true
            HTML5.DynamicDestination: true

  - name: RiskManagement2assets
    type: html5
    path: app/assets
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: RiskManagement2riskmanagement2.risks
    type: html5
    path: app/riskmanagement2.risks
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: RiskManagement2-destinations
    type: com.sap.application.content
    requires:
      - name: RiskManagement2-auth
        parameters:
          service-key:
            name: RiskManagement2-auth-key
      - name: RiskManagement2-html5-repo-host
        parameters:
          service-key:
            name: RiskManagement2-html5-repo-host-key
      - name: srv-api
      - name: RiskManagement2-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: RiskManagement2-html5-repository
              ServiceInstanceName: RiskManagement2-html5-repo-host
              ServiceKeyName: RiskManagement2-html5-repo-host-key
              sap.cloud.service: RiskManagement2.service
            - Name: RiskManagement2-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: RiskManagement2-auth
              ServiceKeyName: RiskManagement2-auth-key
              sap.cloud.service: RiskManagement2.service

  - name: RiskManagement2-mtx
    type: nodejs
    path: gen/mtx/sidecar
    requires:
      - name: RiskManagement2-auth
      - name: RiskManagement2-db
      - name: RiskManagement2-registry
      - name: app-api
        properties:
          SUBSCRIPTION_URL: ~{app-protocol}://\${tenant_subdomain}-~{app-uri}
      - name: RiskManagement2-destination
      - name: RiskManagement2-html5-runtime
      - name: RiskManagement2-html5-repo-host
    build-parameters:
      builder: npm-ci
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
    hooks:
      - name: upgrade-all
        type: task
        phases:
          - blue-green.application.before-start.idle
          - deploy.application.before-start
        parameters:
          name: upgrade
          memory: 512M # increase as required
          disk-quota: 768M # increase as required
          command: cds-mtx upgrade '*'
    provides:
      - name: mtx-api
        properties:
          mtx-url: ${default-url}

resources:
  - name: RiskManagement2-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: RiskManagement2-CERT
        tenant-mode: shared
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: RiskManagement2-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            existing_destinations_policy: update
            destinations:
              - Name: RiskManagement2-workzone-runtime
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                URL: https://${org}.launchpad.${default-domain}
                CEP.HTML5contentprovider: true
    requires:
      - name: srv-api

  - name: RiskManagement2-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: RiskManagement2-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: RiskManagement2-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: service-manager
      service-plan: container
  - name: RiskManagement2-registry
    type: org.cloudfoundry.managed-service
    requires:
      - name: mtx-api
    parameters:
      service: saas-registry
      service-plan: application
      config:
        xsappname: RiskManagement2-${org}-${space}
        appName: RiskManagement2-${org}-${space}
        displayName: RiskManagement2
        description: A simple CAP project.
        category: 'Category'
        appUrls:
          getDependencies: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/dependencies
          onSubscription: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/tenant/{tenantId}
          onSubscriptionAsync: true
          onUnSubscriptionAsync: true
          onUpdateDependenciesAsync: true
          callbackTimeoutMillis: 300000 # Increase if your deployments are taking longer than that
